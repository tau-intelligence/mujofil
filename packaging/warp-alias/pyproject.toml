[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "mujofil-warp"
version = "0.2.0"
description = "Deprecated alias. The project was renamed to `mujofil` in 0.2.0 — installing this just installs `mujofil`. Use `pip install mujofil` and `import mujofil`."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Tau Intelligence" }]
keywords = ["mujoco", "filament", "pbr", "rendering", "reinforcement-learning", "deprecated", "alias"]
classifiers = [
    "Development Status :: 7 - Inactive",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
]

# The whole point of this package: pulling it in pulls the real `mujofil`,
# which itself ships a thin `mujofil_warp` compatibility shim module. This
# package intentionally contains NO modules of its own so it cannot collide
# with that shim on install.
dependencies = ["mujofil>=0.2.0"]

[project.urls]
Homepage = "https://github.com/tau-intelligence/mujofil"
Repository = "https://github.com/tau-intelligence/mujofil"
Issues = "https://github.com/tau-intelligence/mujofil/issues"

[tool.setuptools]
# No packages, no py-modules: a pure metapackage (dependency-only).
py-modules = []
