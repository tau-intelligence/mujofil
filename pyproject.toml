[build-system]
requires = ["scikit-build-core>=0.8", "pybind11>=2.11"]
build-backend = "scikit_build_core.build"

[project]
name = "mujofil-warp"
version = "0.1.0"
description = "Photoreal Filament PBR rendering for GPU-resident MuJoCo (MJWarp), zero-copy to PyTorch"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Tau Intelligence" }]
keywords = ["mujoco", "mjwarp", "filament", "pbr", "rendering", "reinforcement-learning", "sim-to-real"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: POSIX :: Linux",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Multimedia :: Graphics :: 3D Rendering",
]
dependencies = [
    "mujoco>=3.2",
    "mujoco-warp",
    "warp-lang",
    "numpy",
]

[project.optional-dependencies]
torch = ["torch>=2.4"]
examples = ["pillow"]

[project.urls]
Homepage = "https://github.com/tau-intelligence/mujofil-warp"
Repository = "https://github.com/tau-intelligence/mujofil-warp"
Issues = "https://github.com/tau-intelligence/mujofil-warp/issues"

# ============================================================================
# scikit-build-core: drive the CMake build. The native modules
# (_mujofil_warp_gl, _mujofil_warp) + compiled materials install into the
# mujofil_warp/ package. Filament is auto-downloaded by CMake at build time.
# ============================================================================
[tool.scikit-build]
cmake.build-type = "Release"
wheel.packages = ["mujofil_warp"]
sdist.include = [
    "CMakeLists.txt",
    "native/render_module.cpp",
    "native/renderer_gl.cpp",
    "native/renderer_warp.cpp",
    "native/vendor/core",
    "third_party/dlpack",
    "third_party/bluevk",
    "third_party/utils_include",
    "third_party/mujoco/include",
    "mujofil_warp/materials",
    "packaging/build_filament_egl.sh",
    "packaging/filament-patches",
    "NOTICE",
]
sdist.exclude = [
    "third_party/filament-src",
    "spikes",
    "out",
    ".venv",
    "**/__pycache__",
]

[tool.scikit-build.cmake.define]
# FILAMENT_DIR may be supplied via env or -C to skip the auto-download.

# ============================================================================
# cibuildwheel: one wheel per CPython 3.10-3.13, manylinux_2_34 (AlmaLinux 9,
# glibc 2.34 -- the floor imposed by Filament 1.56.3's prebuilt libs). Built with
# Clang + libc++. We have NO CUDA device code, so a single wheel built against a
# STATIC CUDA 12.0 cudart runs on ANY NVIDIA GPU with driver >= R525.
# ============================================================================
[tool.cibuildwheel]
build = "cp310-* cp311-* cp312-* cp313-*"
skip = "*-musllinux_* *_i686 pp*"
build-frontend = "build"
# Import-only smoke test (no GPU/X in CI): loads the .so, exercises backend
# selection (falls back to the Vulkan module when DISPLAY is unset). No device
# init happens at import, so this is safe on a GPU-less runner.
test-command = "python -c \"import mujofil_warp; print('mujofil-warp', mujofil_warp.__version__)\""

[tool.cibuildwheel.linux]
manylinux-x86_64-image = "quay.io/pypa/manylinux_2_34_x86_64"
# Build with the LLVM release toolchain at /opt/llvm (extracted in before-all):
# its clang++ ships a matching libc++ (headers + runtime) as one consistent set,
# so `-stdlib=libc++` finds <cstdint>/<fstream> etc. The container's dnf clang
# has NO libc++ headers, which broke the compile. --gcc-toolchain points the
# portable LLVM clang at manylinux's gcc-toolset-14 for the C runtime objects
# (crtbeginS.o, libgcc) and the linker, which it otherwise cannot locate.
environment = { CC = "/opt/llvm/bin/clang", CXX = "/opt/llvm/bin/clang++", CFLAGS = "--gcc-toolchain=/opt/rh/gcc-toolset-14/root/usr", CXXFLAGS = "--gcc-toolchain=/opt/rh/gcc-toolset-14/root/usr", LDFLAGS = "--gcc-toolchain=/opt/rh/gcc-toolset-14/root/usr", FILAMENT_DIR = "/project/_filament_egl", CUDAToolkit_ROOT = "/usr/local/cuda-12.0" }
before-all = [
    # Build deps: GL + EGL headers, common libs. (clang itself comes from the
    # LLVM tarball below; the dnf clang lacks libc++ headers.)
    "dnf install -y wget tar xz gzip libatomic libpng-devel zlib-devel libglvnd-devel mesa-libGL-devel mesa-libEGL-devel || yum install -y wget tar xz gzip libatomic libpng-devel zlib-devel libglvnd-devel mesa-libGL-devel mesa-libEGL-devel",
    # CUDA 12.0 headers + STATIC cudart (no device code -> wide driver coverage).
    # The static libcudart_static.a + libculibos.a + headers ship in the -devel
    # package (there is no separate cuda-cudart-static-NN-N package on RHEL9).
    "wget -q https://developer.download.nvidia.com/compute/cuda/repos/rhel9/x86_64/cuda-rhel9.repo -O /etc/yum.repos.d/cuda.repo",
    "dnf install -y cuda-cudart-devel-12-0 cuda-driver-devel-12-0",
    # Full LLVM 18.1.8 toolchain (glibc 2.17 build): provides clang++ AND its
    # bundled libc++ headers + runtime as one consistent set. Extract to
    # /opt/llvm (CC/CXX point here). Also copy the libc++/libunwind runtime .so
    # to /usr/lib64 so the linker + loader find them and auditwheel bundles them.
    "wget -q https://github.com/llvm/llvm-project/releases/download/llvmorg-18.1.8/clang+llvm-18.1.8-x86_64-linux-gnu-ubuntu-18.04.tar.xz -O /tmp/llvm.tar.xz",
    "mkdir -p /opt/llvm && tar -xf /tmp/llvm.tar.xz -C /opt/llvm --strip-components=1",
    "find /opt/llvm \\( -name 'libc++.so*' -o -name 'libc++abi.so*' -o -name 'libunwind.so*' \\) -exec cp -P {} /usr/lib64/ \\; && ldconfig",
    # The LLVM 18 ubuntu-18.04 clang binary links libtinfo.so.5, but AlmaLinux 9
    # ships libtinfo.so.6 -> 'cannot open libtinfo.so.5'. Provide a compat symlink
    # (install ncurses-compat-libs first if available, else symlink so.6).
    "dnf install -y ncurses-compat-libs || true; [ -e /usr/lib64/libtinfo.so.5 ] || ln -s $(ls /usr/lib64/libtinfo.so.6* | head -1) /usr/lib64/libtinfo.so.5; ldconfig",
    # Prebuilt EGL-enabled Filament (Google's prebuilt is GLX-only and cannot
    # render headless). One artifact serves BOTH GL and Vulkan modules. Because
    # the release lives on a PRIVATE repo, it is fetched + extracted by the
    # authenticated 'Fetch prebuilt EGL Filament' workflow step on the host and
    # copied into the container at /project/_filament_egl (FILAMENT_DIR). The
    # check below fails fast if that step did not run.
    "test -d /project/_filament_egl/include || { echo 'FILAMENT_DIR /project/_filament_egl missing — host download step did not run'; exit 1; }",
]
# auditwheel bundles libc++/libc++abi/libunwind, but MUST NOT bundle the driver,
# GL, EGL or Vulkan libs -- those are provided by the user's system/driver at
# runtime (bundling the build container's MESA software-GL would break NVIDIA
# acceleration). Exclude them so they resolve from the host.
repair-wheel-command = "auditwheel repair --exclude libcuda.so.1 --exclude libcudart.so.12 --exclude libGL.so.1 --exclude libGLX.so.0 --exclude libGLdispatch.so.0 --exclude libEGL.so.1 --exclude libvulkan.so.1 -w {dest_dir} {wheel}"

