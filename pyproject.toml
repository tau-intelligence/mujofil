[build-system]
requires = ["scikit-build-core>=0.8", "pybind11>=2.11"]
build-backend = "scikit_build_core.build"

[project]
name = "mujofil-warp"
version = "0.1.0"
description = "Photoreal Filament PBR rendering for GPU-resident MuJoCo (MJWarp), zero-copy to PyTorch"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Tau Intelligence" }]
keywords = ["mujoco", "mjwarp", "filament", "pbr", "rendering", "reinforcement-learning", "sim-to-real"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: POSIX :: Linux",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Multimedia :: Graphics :: 3D Rendering",
]
dependencies = [
    "mujoco>=3.2",
    "mujoco-warp",
    "warp-lang",
    "numpy",
]

[project.optional-dependencies]
torch = ["torch>=2.4"]
examples = ["pillow"]

[project.urls]
Homepage = "https://github.com/tau-intelligence/mujofil-warp"
Repository = "https://github.com/tau-intelligence/mujofil-warp"
Issues = "https://github.com/tau-intelligence/mujofil-warp/issues"

# ============================================================================
# scikit-build-core: drive the CMake build. The native modules
# (_mujofil_warp_gl, _mujofil_warp) + compiled materials install into the
# mujofil_warp/ package. Filament is auto-downloaded by CMake at build time.
# ============================================================================
[tool.scikit-build]
cmake.build-type = "Release"
wheel.packages = ["mujofil_warp"]
sdist.include = [
    "CMakeLists.txt",
    "native/render_module.cpp",
    "native/renderer_gl.cpp",
    "native/renderer_warp.cpp",
    "native/vendor/core",
    "third_party/dlpack",
    "third_party/bluevk",
    "third_party/utils_include",
    "mujofil_warp/materials",
    "NOTICE",
]
sdist.exclude = [
    "third_party/filament-src",
    "spikes",
    "out",
    ".venv",
    "**/__pycache__",
]

[tool.scikit-build.cmake.define]
# FILAMENT_DIR may be supplied via env or -C to skip the auto-download.

# ============================================================================
# cibuildwheel: one wheel per CPython 3.10-3.13, manylinux_2_34 (AlmaLinux 9,
# glibc 2.34 -- the floor imposed by Filament 1.56.3's prebuilt libs). Built with
# Clang + libc++. We have NO CUDA device code, so a single wheel built against a
# STATIC CUDA 12.0 cudart runs on ANY NVIDIA GPU with driver >= R525.
# ============================================================================
[tool.cibuildwheel]
build = "cp310-* cp311-* cp312-* cp313-*"
skip = "*-musllinux_* *_i686 pp*"
build-frontend = "build"
# Import-only smoke test (no GPU/X in CI): loads the .so, exercises backend
# selection (falls back to the Vulkan module when DISPLAY is unset). No device
# init happens at import, so this is safe on a GPU-less runner.
test-command = "python -c \"import mujofil_warp; print('mujofil-warp', mujofil_warp.__version__)\""

[tool.cibuildwheel.linux]
manylinux-x86_64-image = "quay.io/pypa/manylinux_2_34_x86_64"
environment = { CC = "clang", CXX = "clang++", FILAMENT_DIR = "/project/_filament", CUDAToolkit_ROOT = "/usr/local/cuda-12.0" }
before-all = [
    # Build deps: GL/GLX + X11 + EGL headers, clang, common libs.
    "dnf install -y wget tar xz gzip clang libatomic libpng-devel zlib-devel libX11-devel libglvnd-devel mesa-libGL-devel mesa-libEGL-devel || yum install -y wget tar xz gzip clang libatomic libpng-devel zlib-devel libX11-devel libglvnd-devel mesa-libGL-devel mesa-libEGL-devel",
    # CUDA 12.0 headers + STATIC cudart (no device code -> wide driver coverage).
    "wget -q https://developer.download.nvidia.com/compute/cuda/repos/rhel9/x86_64/cuda-rhel9.repo -O /etc/yum.repos.d/cuda.repo",
    "dnf install -y cuda-cudart-static-12-0 cuda-cudart-devel-12-0 cuda-driver-devel-12-0 || yum install -y cuda-cudart-static-12-0 cuda-cudart-devel-12-0 cuda-driver-devel-12-0",
    # libc++ runtime (Filament is built with libc++) -> bundled into the wheel by
    # auditwheel. Fetched from the LLVM release (needs only glibc 2.17).
    "wget -q https://github.com/llvm/llvm-project/releases/download/llvmorg-18.1.8/clang+llvm-18.1.8-x86_64-linux-gnu-ubuntu-18.04.tar.xz -O /tmp/llvm.tar.xz",
    "mkdir -p /tmp/llvm && tar -xf /tmp/llvm.tar.xz -C /tmp/llvm --wildcards '*/libc++.so*' '*/libc++abi.so*' '*/libunwind.so*'",
    "find /tmp/llvm \\( -name 'libc++.so*' -o -name 'libc++abi.so*' -o -name 'libunwind.so*' \\) -exec cp -P {} /usr/lib64/ \\; && ldconfig",
    # Prebuilt Filament (auto-download is skipped because FILAMENT_DIR is set).
    "wget -q https://github.com/google/filament/releases/download/v1.56.3/filament-v1.56.3-linux.tgz -O /tmp/filament.tgz",
    "mkdir -p /project/_filament && tar -xzf /tmp/filament.tgz -C /project/_filament --strip-components=1",
]
# auditwheel bundles libc++/libc++abi/libunwind, but MUST NOT bundle the driver,
# GL, X11, EGL or Vulkan libs -- those are provided by the user's system/driver
# at runtime (bundling the build container's MESA software-GL would break NVIDIA
# acceleration). Exclude them so they resolve from the host.
repair-wheel-command = "auditwheel repair --exclude libcuda.so.1 --exclude libcudart.so.12 --exclude libGL.so.1 --exclude libGLX.so.0 --exclude libGLdispatch.so.0 --exclude libEGL.so.1 --exclude libX11.so.6 --exclude libvulkan.so.1 -w {dest_dir} {wheel}"

