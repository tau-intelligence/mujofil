name: Build and publish wheels

# Builds manylinux_2_34 wheels (cp310-313) for x86_64 + the sdist.
# - Pushes to main / PRs: build + smoke-test only (no publish).
# - Tags v*: build, then publish to PyPI via OIDC Trusted Publishing (no token).
on:
  push:
    branches: [master, main]
    tags: ["v*"]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

jobs:
  build_wheels:
    name: Wheels (${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # One job per CPython so a single failing version doesn't block the rest.
        python: [cp310, cp311, cp312, cp313]
    steps:
      - uses: actions/checkout@v4

      # The EGL Filament artifact lives on a *private* repo release, so it can't
      # be fetched by an unauthenticated wget inside the manylinux container.
      # Download + extract it here (gh is authenticated via GITHUB_TOKEN); the
      # resulting _filament_egl/ dir is copied into /project by cibuildwheel,
      # where FILAMENT_DIR=/project/_filament_egl picks it up.
      - name: Fetch prebuilt EGL Filament
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p _filament_egl
          gh release download filament-egl-v1.56.3 \
            --repo "${{ github.repository }}" \
            --pattern 'filament-egl-v1.56.3-linux-x86_64.tgz' \
            --output /tmp/filament-egl.tgz --clobber
          tar -xzf /tmp/filament-egl.tgz -C _filament_egl --strip-components=1
          test -d _filament_egl/include || { echo "Filament include/ missing"; exit 1; }

      - name: Build wheels
        uses: pypa/cibuildwheel@v2.23.3
        env:
          CIBW_BUILD: "${{ matrix.python }}-*"
        with:
          output-dir: wheelhouse

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.python }}
          path: wheelhouse/*.whl

  build_sdist:
    name: Source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build sdist
        run: |
          python -m pip install --upgrade build
          python -m build --sdist
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz

  publish:
    name: Publish to PyPI
    needs: [build_wheels, build_sdist]
    runs-on: ubuntu-latest
    # Only publish on a version tag.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    environment:
      name: pypi
      url: https://pypi.org/project/mujofil/
    permissions:
      id-token: write   # OIDC Trusted Publishing -- no API token needed.
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1
